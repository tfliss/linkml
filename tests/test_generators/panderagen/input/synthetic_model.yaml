id: https://w3id.org/linkml/examples/dataframe_conversion
name: dataframe_conversion
prefixes:
  ex: https://w3id.org/linkml/examples/dataframe_conversion/
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
default_prefix: ex
default_range: string

classes:
  NestedRecord:
    description: Nested object inlined in lists and maps
    attributes:
      code:
        identifier: true
        range: string
      metric:
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 10000
      score:
        range: integer
        required: true

  RecordDictionary:
    description: Simple dictionary entry
    attributes:
      code:
        identifier: true
        range: string
      metric:
        range: integer
        required: true

  DataframeRow:
    description: Row structure modeled after the Polars JSON conversion example
    # tree_root: true
    attributes:
      id_column:
        identifier: true
        range: integer
        required: true
      flag_column:
        range: boolean
        required: true
        #ifabsent: true
      count_column:
        description: test integer column with min/max values
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 999
        #ifabsent: int(5)
      ratio_column:
        description: test float column
        range: float
        required: true
        #ifabsent: float(2.3)
      label_column:
        description: test string column
        range: string
        required: true
        pattern: "^(this)|(that)|(whatever)$"
        #ifabsent: string("whatever")
      event_date_column:
        description: test date column
        range: date
        required: true
        #ifabsent: date("2020-01-31")
      event_datetime_column:
        description: test datetime column
        range: datetime
        required: true
        #ifabsent: datetime("2020-01-31 03:23:57")
      enum_column:
        description: test enum column
        range: DemoEnum
        required: true
      ontology_enum_column:
        range: DemoOntologyEnum
        required: true
        #ifabsent: DemoOntologyEnum(ALPHA)
      multivalued_column:
        description: one-to-many form
        range: integer
        multivalued: true
        inlined_as_list: true
        required: true
      singular_column:
        description: check cardinality
        range: integer
        minimum_cardinality: 1
        maximum_cardinality: 1
        required: true
      nested_object_column:
        description: test column that is a directly nested single object (no dictionary collection)
        range: NestedRecord
        required: true
        inlined: true
      foreign_key_column:
        description: test column that is an association to another table
        range: NestedRecord
      inlined_list_column:
        description: test column with another class inlined as a list
        range: NestedRecord
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  AnyType:
    description: the magic class_uri makes this map to linkml Any or polars Object
    class_uri: linkml:Any

  # NestedRecordDictionary:
  #   description: A list of inlined objects within a simple dict
  #   attributes:
  #     id:
  #       identifier: True
  #       range: string
  #     nested_list:
  #       range: NestedRecord
  #       multivalued: True
  #       inlined: True
  #       inlined_as_list: False

  # DoubleNestedRecordDictionary:
  #   description: A list of inlined objects within a simple dict
  #   attributes:
  #     id:
  #       identifier: True
  #       range: string
  #     nested_simple_dict_list:
  #       range: NestedRecordDictionary
  #       multivalued: True
  #       inlined: True
  #       inlined_as_list: False

  DataframeRowFull:
    description: Includes all efficient types and inefficient dict types
    mixins:
    - DataframeRow
    attributes:
      # multivalued_one_many_column:
      #   description: list form
      #   range: integer
      #   required: true
      #   multivalued: true
      any_type_column:
        description: needs to have type object
        range: AnyType
        required: true
      inlined_map_column:
        description: test column with another class inlined as a struct
        range: NestedRecord
        multivalued: true
        inlined: true
        required: true
      inlined_simple_dict_column:
        description: test column inlined using simple dict form
        range: RecordDictionary
        multivalued: true
        inlined: true
        inlined_as_list: false
        required: true
      # inlined_nested_simple_dict_column:
      #   description: test column inlined using simple dict form and list struct other
      #   range: NestedRecordDictionary
      #   multivalued: true
      #   inlined: true
      #   inlined_as_list: false
      #   required: true
      # double_nested_simple_dict_column:
      #   description: test column inlined using simple dict form and list struct other
      #   range: DoubleNestedRecordDictionary
      #   multivalued: true
      #   inlined: true
      #   inlined_as_list: false
      #   required: true

enums:
  DemoEnum:
    permissible_values:
      ALPHA:
      BETA:
      GAMMA:

  DemoOntologyEnum:
    permissible_values:
      fiction: ex:000001
      non fiction: ex:000002
